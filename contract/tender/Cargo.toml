[package]
name = "tender"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
proptest = "1"

[features]
attested = ["near-sdk/unstable"]
