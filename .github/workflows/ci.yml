name: ci

on:
  push:
  pull_request:

# Every action is pinned to the commit of a release, with the release in a comment: a tag can be
# moved, and a moved tag would run new code with the job's token. To update one, take the commit of
# the new release (`gh api repos/<owner>/<repo>/tags`), not the tag.

# The jobs only read the repository. A job that needs more asks for it in its own permissions.
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    # On a pull request, gitleaks-action lists the pull request's commits through the API, which
    # needs pull-requests: read. Read only is enough: without write access it logs a warning
    # instead of commenting, and a leak fails the job anyway.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history, so gitleaks scans every commit in the push or pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # v3, not v2: v2 runs on Node 20, which GitHub-hosted runners dropped on 2026-09-16.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds both contracts and runs every test, the sandbox suites included. The sandbox tests deploy
  # the wasm that build.sh has just built, and near-workspaces downloads nearcore's sandbox node
  # while it compiles.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # rust-toolchain.toml pins Rust 1.96.0 with the wasm32 target, rustfmt and clippy. Rustup 1.28
      # and later install the pinned toolchain only when asked to, so ask.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      # cargo-near 0.22.0, from its release tarball, checked against a checksum pinned here. The
      # checksum is the one on the release (cargo-near-x86_64-unknown-linux-gnu.tar.gz.sha256).
      - name: Install cargo-near 0.22.0
        env:
          CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          set -euo pipefail
          archive=cargo-near-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/$archive"
          echo "$CARGO_NEAR_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cargo-near"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cargo-near"
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "$(find "$RUNNER_TEMP/cargo-near" -type f -name cargo-near | head -n 1)" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      # contract/res is what gets deployed and what the TypeScript side runs against, so it has to
      # be the build of the sources in this commit. build.sh records their hash, bound to
      # res/SHA256SUMS, in res/SOURCES.sha256, and this recomputes it before anything is rebuilt.
      - name: Check that contract/res was built from these sources
        run: ./check-res.sh
      # The wasm is then built again here, and the sandbox tests run that build. Its bytes differ
      # from the committed ones, since another machine builds them.
      - name: Build the wasm
        run: ./build.sh
      - name: Test
        run: cargo test --workspace

  # Type-checks, lints and tests the TypeScript packages. The sandbox tests start a local chain on
  # nearcore's sandbox node (35 MB, Linux x86_64), which the shards would each download at their
  # first test: one step per shard gets it instead, from a cache, and NEAR_SANDBOX_BIN_PATH then
  # points every test at it. The whole suite takes longer than one hosted runner allows, so its test
  # files are split into four shards that run side by side. The first shard also type-checks and
  # lints.
  node:
    name: node (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A real Postgres for the @tender/db tests. They always run on PGlite, which is Postgres 18, and
    # also on this server when TEST_DATABASE_URL is set, so two majors are covered. 17.10 was the
    # newest 17 patch release more than 14 days old when it was pinned. The job's steps wait until
    # the health check passes.
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # pnpm goes before setup-node, whose pnpm cache asks pnpm for the store path. The version
      # matches the packageManager field in package.json, as the action requires. The latest majors
      # of both actions (pnpm/action-setup v6, setup-node v7) run on Node 24.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The key hashes the two files that name the versions it holds: the near-sandbox package
      # (packages/client/package.json) and the nearcore release it downloads (sandbox-node.ts). A
      # new version of either makes a new key, and the step after this one downloads the node.
      - name: Cache the sandbox node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tender-sandbox-node
          key: sandbox-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/client/package.json', 'packages/client/src/sandbox-node.ts') }}
      # Downloads the node into the cached directory unless the cache held it, and prints its path.
      # Running it with --version is the check that the cached file is a node that starts.
      - name: Get the sandbox node
        run: |
          set -euo pipefail
          sandbox_node="$(DIR_TO_DOWNLOAD_BINARY="$HOME/.cache/tender-sandbox-node" pnpm exec tsx scripts/fetch-sandbox-node.ts | tail -n 1)"
          "$sandbox_node" --version
          echo "NEAR_SANDBOX_BIN_PATH=$sandbox_node" >> "$GITHUB_ENV"
      - name: Typecheck
        if: matrix.shard == 1
        run: pnpm typecheck
      - name: Lint
        if: matrix.shard == 1
        run: pnpm lint
      - name: Test
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # The demo a judge runs on a clean machine (`pnpm demo:local`): a local chain, the services and
  # two scripted agents, from a posted task to the Judge's pick. It needs no secret, env file,
  # Postgres or model, so the job has none, and it downloads nearcore's sandbox node at its first
  # start, as a clean machine does (no cache, no NEAR_SANDBOX_BIN_PATH). Its OS temp dir is a tmpfs,
  # as /tmp is on Fedora, Arch and Debian 13, so the download crosses filesystems on every run.
  # The demo prints DEMO OK as its last line, after everything it started has stopped, and the job
  # passes only if that line is in its output.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run the demo
        env:
          TMPDIR: /dev/shm
        run: |
          set -euo pipefail
          # The run proves the download only if the temp dir and node_modules are on different
          # filesystems; if the runner ever mounts /dev/shm on the checkout's, stop and say so.
          if [ "$(stat -c %d "$TMPDIR")" = "$(stat -c %d node_modules)" ]; then
            echo "::error::$TMPDIR is on the filesystem of node_modules, so this run cannot show that the node downloads across filesystems"
            exit 1
          fi
          pnpm demo:local | tee "$RUNNER_TEMP/demo.log"
          grep -Fx 'DEMO OK' "$RUNNER_TEMP/demo.log"
